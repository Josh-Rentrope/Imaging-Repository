[project]
name = "bone-viewer-api"
version = "0.0.1"
description = "Orthodontic reconstruction API (working name)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pydicom>=3.0.2",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
cv = ["numpy>=2.0"]

[dependency-groups]
dev = ["ruff>=0.7", "pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
