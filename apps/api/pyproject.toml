[project]
name = "bone-viewer-api"
version = "0.0.1"
description = "Orthodontic reconstruction API (working name)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pydicom>=3.0.2",
    "numpy>=2.5.3",
    "scikit-image>=0.26.0",
    "nibabel>=5.4.2",
    # For the Spaces backend. A main dependency rather than an extra, because
    # the deployment uses it: an optional import that is missing in production
    # is a failure discovered at deploy time instead of at review time.
    "boto3>=1.35",
]

[project.optional-dependencies]
cv = ["numpy>=2.0"]

[dependency-groups]
dev = ["ruff>=0.7", "pytest>=8.3", "httpx>=0.28", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# skimage reaches into a numpy array's `.shape` in a way numpy 2.5 deprecated.
# Third-party internals, not ours; filtered so the suite stays readable.
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
